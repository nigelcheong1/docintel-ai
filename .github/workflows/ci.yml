name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DOCINTEL_TEST_DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enable pgvector in test database
        run: docker exec "${{ job.services.postgres.id }}" psql -U docintel -d docintel_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full backend test suite
        working-directory: apps/api
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
      - name: Run frontend lint
        working-directory: apps/web
        run: npm run lint
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
